name: strategy-lab

# 手动触发：Actions → strategy-lab → Run workflow。把所有策略在同一股票池上并排回测，结果写到 output/lab.md / lab.json
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行策略实验室
        run: python scan.py --lab

      - name: 提交结果
        if: always()
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "lab: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
